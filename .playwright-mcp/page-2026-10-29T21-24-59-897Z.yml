                  - button "Copy code to clipboard" [ref=e1070] [cursor=pointer]:
                    - img [ref=e1071]
                - paragraph [ref=e1074]: The brain stays in Electron, where it holds the keys, the memory and the Claude session manager. The ear sidecar is only ears, so it stays small and swappable. Every voice engine turns one sentence into audio behind the same interface, so streaming, barge-in, retries and the Kokoro fallback work for all of them. Each Claude Code session does its heavy work in its own context; the voice model sees a one-line brief per session and fetches details on demand, which is why it still answers in about a second after an hour of parallel sessions.
